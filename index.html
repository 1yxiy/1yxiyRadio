<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무전기 메시지 메이커</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ca:#1c2b33;--cb:#8c2f39;--pgbg:#ffffff;--tx:#1c2b33;--ti:#ffffff;--tt:#1c2b33;--onc:#ffffff;--cb2:#ffffff;--line:#d1d1d1;--ff:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--pgbg);color:var(--tx);font-family:var(--ff);font-size:15px;line-height:1.5;padding:16px}
h1{text-align:center;font-size:17px;font-weight:600;letter-spacing:.04em;margin:4px 0 16px;color:var(--ca)}
.app{display:grid;gap:16px;max-width:560px;margin:0 auto}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{border:1.5px solid var(--line);border-radius:12px;padding:14px;background:var(--cb2)}
.card h2{font-size:13px;font-weight:600;letter-spacing:.06em;margin:0 0 10px;color:var(--ca)}
summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--ca)}
details[open]>summary{margin-bottom:12px}
input,textarea,select{font:inherit;font-size:16px;color:var(--tt);background:var(--ti);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;outline:none;width:100%;min-width:0}
input:focus,textarea:focus,select:focus{border-color:var(--sc,var(--ca))}
textarea{resize:vertical;min-height:72px;line-height:1.5}
input[type=color]{padding:2px;width:44px;flex:none;cursor:pointer}
input[type=checkbox]{width:auto;min-height:0;accent-color:var(--ca);margin-right:8px;vertical-align:middle}
button{font:inherit;font-size:15px;min-height:44px;padding:8px 12px;border-radius:8px;cursor:pointer;width:100%;color:var(--ca);background:transparent;border:1.5px solid currentColor}
button:active{opacity:.7}
button:disabled{opacity:.35}
button.send{background:var(--sc,var(--ca));color:var(--onc);border-color:var(--sc,var(--ca));font-weight:600;margin-top:10px}
button.sw{flex:none;width:30px;height:30px;min-height:30px;padding:0;border-radius:50%;border:1.5px solid var(--line)}
.lbl{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:14px}
.lbl>span:first-child{flex:none;min-width:66px;opacity:.8}
.stage{display:flex;justify-content:center;gap:8px}
.unit{flex:1;max-width:250px;text-align:center;color:var(--g)}
.radio{position:relative;aspect-ratio:160/320;width:100%}
.radio svg{position:absolute;inset:0;width:100%;height:100%}
.radio svg *{vector-effect:non-scaling-stroke}
.lcd{position:absolute;left:20%;top:28.75%;width:60%;height:23.75%;border:1.5px solid var(--g);border-radius:4px;padding:4px 5px;font-size:clamp(9px,2.7vw,12px);line-height:1.25;overflow:hidden;word-break:break-word}
.lcd b{display:block;font-size:.8em;opacity:.75;letter-spacing:.06em}
.lcd p{margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.lcd .wv{display:none;align-items:center;justify-content:space-between;gap:2px;height:calc(100% - 14px)}
.lcd .wv i{flex:1;min-height:2px;border-radius:2px;background:var(--g);transition:height .25s}
.lcd.wave p{display:none}.lcd.wave .wv{display:flex}
.led{position:absolute;left:46.5%;top:20%;width:7%;aspect-ratio:1;border-radius:50%;border:2px solid var(--g)}
.radio.tx .led,.radio.rx .led{background:var(--g)}
.arc{position:absolute;top:2%;left:50%;font-size:20px;opacity:0;pointer-events:none}
.arc.go{animation:ar 1s ease-out}
@keyframes ar{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.cfg{display:flex;gap:6px;align-items:center;margin-top:6px}
.cfg input[type=color]{width:40px;min-height:36px;border-color:var(--g)}
.unit .nm,.unit .hex,.unit .chn{flex:1;text-align:center;min-height:36px;padding:4px 6px;font-size:15px}
.unit .nm{border-color:var(--g);color:var(--g);font-weight:600}
.unit .hex{text-transform:lowercase}
.sel{display:flex;gap:8px;margin-bottom:10px}
.sel button{flex:1;min-width:0;color:var(--g);border-color:var(--g);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel button.on{background:var(--g);color:var(--onc)}
.log h2{margin-bottom:6px}
.ln{padding:8px 0;border-bottom:1px solid var(--line);color:var(--g);display:flex;gap:8px;align-items:flex-start;word-break:break-word}
.ln:last-child{border-bottom:none}
.ln .tx{flex:1}
.ln i{font-style:normal;opacity:.65;font-size:12px}
.ln button{width:36px;min-height:36px;padding:0;flex:none;color:var(--g);font-size:14px}
.ed{flex:1}.ed input,.ed textarea{border-color:var(--g);color:var(--g);margin-bottom:8px}.ed div{display:flex;gap:8px}.ed div button{width:auto;flex:1;min-height:40px}
.exp{display:flex;gap:8px;margin-bottom:12px}
.opt{display:block;margin-bottom:12px;font-size:14px}
#msg{font-size:13px;opacity:.85;min-height:20px}
.imp textarea{height:150px;margin-bottom:10px}
.imp .two{display:flex;gap:8px}
#pvw img{max-width:100%;display:block;border:1.5px solid var(--line);border-radius:8px;margin-top:6px}
.empty{font-size:14px;opacity:.6;padding:6px 0}
@media (min-width:900px){
  body{padding:28px 32px;font-size:16px}
  h1{font-size:21px;margin-bottom:24px}
  .app{max-width:1120px;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:start}
  .col{gap:18px}
  .colL{position:sticky;top:20px}
  .stage{gap:16px}.unit{max-width:280px}
  .lcd{font-size:13px}
  .card{padding:18px}
  #log{max-height:46vh;overflow:auto}
}
</style>
</head>
<body>
<h1>무전기 메시지 메이커</h1>
<div class="app">
<div class="col colL">
  <div class="stage" id="stage"></div>
  <details class="card"><summary>화면·배경 설정</summary>
    <div class="lbl"><span>배경</span><input type="color" id="bgp" value="#ffffff" aria-label="배경색"><input id="bgh" value="#ffffff" maxlength="7" spellcheck="false" aria-label="배경 Hex"></div>
    <div class="lbl"><span></span><span id="sws" style="display:flex;gap:10px;flex-wrap:wrap"></span></div>
    <div class="lbl"><span>화면 내용</span><select id="lmode" aria-label="화면 내용"><option value="wave" selected>음성 파형</option><option value="text">텍스트</option></select></div>
    <div class="lbl" style="margin-bottom:0"><span>화면 표시</span><input id="ltx" value="TX ▶" maxlength="10" aria-label="송신 표시"><input id="lrx" value="RX ◀" maxlength="10" aria-label="수신 표시"><input id="lst" value="STANDBY" maxlength="10" aria-label="대기 표시"></div>
  </details>
</div>
<div class="col colR">
  <div class="card" id="compose"><h2>메시지</h2>
    <div class="sel"><button id="sa" class="on"></button><button id="sb"></button></div>
    <textarea id="t" placeholder="메시지 입력..."></textarea>
    <div class="lbl" style="margin:10px 0 0"><span>시간</span><input id="tm" maxlength="12" placeholder="비우면 현재 시각 (예: 오후 3:21)"></div>
    <button class="send" id="go">PUSH TO TALK ▶</button>
  </div>
  <div class="card log" id="log"></div>
  <button id="clr" style="min-height:38px;font-size:13px;opacity:.8">전체 지우기</button>
  <div class="card"><h2>저장</h2>
    <div class="exp"><button id="png" disabled>🖼 PNG 저장</button><button id="gif" disabled>🎞 GIF 저장</button></div>
    <label class="opt"><input type="checkbox" id="wave" checked>대사·전파 모양 넣기</label>
    <div class="lbl"><span>저장 비율</span><select id="ratio" aria-label="저장 비율"><option value="auto" selected>자동 (세로로 길게)</option><option value="land">4:3 가로</option><option value="port">3:4 세로</option></select></div>
    <div class="lbl"><span>GIF 속도</span><select id="gsp" aria-label="GIF 글자 속도"><option value="slow" selected>느리게</option><option value="mid">보통</option><option value="fast">빠르게</option></select></div>
    <div id="msg"></div>
    <div id="pvw"></div>
  </div>
  <details class="card imp"><summary>대본 일괄 입력</summary>
    <textarea id="prm" spellcheck="false" aria-label="대본 생성 프롬프트" style="height:130px"></textarea>
    <button id="cpy" style="margin-bottom:12px">프롬프트 복사</button>
    <textarea id="scr" spellcheck="false" aria-label="대본"></textarea>
    <div class="two"><button id="imp1">불러오기 (기록 교체)</button><button id="imp2">뒤에 추가</button></div>
  </details>
</div>
</div>
<script>
const SVB=`<svg viewBox="0 0 160 320" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><defs><filter id="wb" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
<g filter="url(#wb)"><path d="M104 62L106 14Q110 6 114 14L116 62" fill="#f4f2ee"/>
<path d="M16 72Q16 60 28 60H132Q144 60 144 72V302Q144 314 132 314H28Q16 314 16 302Z" fill="#f4f2ee" stroke-width="2.6"/>
<rect x="27" y="87" width="106" height="86" rx="3"/>
<path d="M54 190H106M54 200H106M54 210H106M54 220H106" stroke-width="3.4" stroke-dasharray="0 7.4"/>
<rect x="30" y="238" width="30" height="14" rx="2"/><rect x="65" y="238" width="30" height="14" rx="2"/><rect x="100" y="238" width="30" height="14" rx="2"/>
<rect x="6" y="118" width="11" height="54" rx="2" fill="#f4f2ee"/></g></svg>`;
const SV={basic:SVB};
let BG="#ffffff";const radioSVG=()=>SVB.replaceAll("#f4f2ee",BG);
const THM={basic:{bg:"#ffffff",glow:0,ff:"'IBM Plex Sans KR','Noto Sans KR','Apple SD Gothic Neo',sans-serif",fz:1,cols:["#1c2b33","#8c2f39"]}};
let TH="basic",FF=THM.basic.ff,FZ=THM.basic.fz;
const $=id=>document.getElementById(id),stage=$("stage"),log=$("log"),t=$("t"),root=document.documentElement.style;
const defN=["무전기 A","무전기 B"],defC=["#1c2b33","#8c2f39"],U=[],K=["a","b"];
let msgs=[],cur=0,edit=null,nid=1;
[0,1].forEach(i=>{
  const u=document.createElement("div");u.className="unit";u.style.setProperty("--g",`var(--c${K[i]})`);
  u.innerHTML=`<div class="radio">${radioSVG()}<div class="led"></div><div class="lcd"><b></b><p></p><div class="wv">${"<i></i>".repeat(21)}</div></div><div class="arc">${i?")))":"((("}</div></div>
  <div class="cfg"><input type="color" value="${defC[i]}" aria-label="색"><input class="hex" value="${defC[i]}" maxlength="7" spellcheck="false" aria-label="Hex 코드"></div><div class="cfg"><input class="nm" value="${defN[i]}" aria-label="이름" maxlength="14" placeholder="이름"></div><div class="cfg"><input class="chn" value="CH-${"AB"[i]}" aria-label="채널명" maxlength="10" placeholder="채널명"></div>`;
  stage.appendChild(u);U.push(u);
  const pk=u.querySelector("input[type=color]"),hx=u.querySelector(".hex");
  pk.oninput=()=>{hx.value=pk.value;hx.style.borderBottomColor="";root.setProperty("--c"+K[i],pk.value);sync()};
  hx.oninput=()=>{
    let v=hx.value.trim();if(v[0]!=="#")v="#"+v;
    if(/^#[0-9a-f]{3}$/i.test(v))v="#"+[...v.slice(1)].map(x=>x+x).join("");
    if(/^#[0-9a-f]{6}$/i.test(v)){v=v.toLowerCase();pk.value=v;hx.style.borderBottomColor="";root.setProperty("--c"+K[i],v);sync()}
    else hx.style.borderBottomColor="#ff4d4d";
  };
  u.querySelector(".nm").oninput=render;u.querySelector(".chn").oninput=render;
});
const nm=i=>U[i].querySelector(".nm").value||defN[i];
const lb=k=>$("l"+k).value;
$("lmode").onchange=()=>render();
function wave(x,n){let h=0;for(const c of x)h=(h*31+c.charCodeAt(0))>>>0;let a=h||1;const r=[];
  for(let i=0;i<n;i++){a=(a*1664525+1013904223)>>>0;const env=Math.sin(Math.PI*(i+.5)/n);r.push(.12+.88*env*(.35+.65*a/4294967296))}
  return r}
["ltx","lrx","lst"].forEach(id=>$(id).oninput=()=>render());
const ch=i=>U[i].querySelector(".chn").value||"CH-"+"AB"[i];
const col=i=>U[i].querySelector("input[type=color]").value;
function sync(){
  root.setProperty("--sc",col(cur));
  $("compose").style.setProperty("--sc",col(cur));
  [0,1].forEach(i=>{const b=$(i?"sb":"sa");b.style.setProperty("--g",col(i));b.classList.toggle("on",i===cur);b.textContent=nm(i)+" 송신"});
}
function pick(i){cur=i;sync()}
$("sa").onclick=()=>pick(0);$("sb").onclick=()=>pick(1);
const flash=(el,c)=>{el.classList.remove(c);void el.offsetWidth;el.classList.add(c)};
function render(){
  sync();
  const last=msgs[msgs.length-1];
  [0,1].forEach(i=>{
    const r=U[i].querySelector(".radio"),b=r.querySelector("b"),p=r.querySelector("p");
    if(!last){b.textContent=ch(i)+" · "+lb("st");p.textContent="_"}
    else{b.textContent=ch(i)+" · "+(last.s===i?lb("tx"):lb("rx"));p.textContent=last.x}
    {const lc=r.querySelector(".lcd"),hs=last?wave(last.x,21):Array(21).fill(.08);lc.classList.toggle("wave",$("lmode").value==="wave");lc.querySelectorAll(".wv i").forEach((e,k)=>e.style.height=(hs[k]*100)+"%")}
  });
  log.innerHTML="";const h=document.createElement("h2");h.textContent="교신 기록";log.appendChild(h);
  if(!msgs.length){const e=document.createElement("div");e.className="empty";e.textContent="아직 기록이 없어요. 메시지를 보내거나 대본을 불러오세요.";log.appendChild(e)}
  msgs.forEach(m=>{
    const l=document.createElement("div");l.className="ln";l.style.setProperty("--g",`var(--c${K[m.s]})`);
    if(edit===m.id){
      const d=document.createElement("div");d.className="ed";
      const ta=document.createElement("textarea");ta.value=m.x;
      const ti=document.createElement("input");ti.value=m.t;ti.maxLength=12;ti.setAttribute("aria-label","시간");
      const bw=document.createElement("div");
      const ok=document.createElement("button"),no=document.createElement("button");
      ok.textContent="저장";no.textContent="취소";ok.style.setProperty("--g",col(m.s));no.style.setProperty("--g",col(m.s));
      ok.onclick=()=>{const v=ta.value.trim();if(v)m.x=v;const tv=ti.value.trim();if(tv)m.t=tv;edit=null;render()};
      no.onclick=()=>{edit=null;render()};
      bw.append(ok,no);d.append(ti,ta,bw);l.appendChild(d);
    }else{
      const x=document.createElement("div");x.className="tx";
      const i=document.createElement("i");i.textContent="["+m.t+"] ";
      x.append(i,nm(m.s)+" ▶ "+m.x);
      const e=document.createElement("button"),d=document.createElement("button");
      e.textContent="✎";e.setAttribute("aria-label","수정");d.textContent="✕";d.setAttribute("aria-label","삭제");
      e.onclick=()=>{edit=m.id;render()};
      d.onclick=()=>{msgs=msgs.filter(z=>z!==m);render()};
      l.append(x,e,d);
    }
    log.appendChild(l);
  });
  $("png").disabled=$("gif").disabled=!msgs.length;
}
function send(){
  const x=t.value.trim();if(!x)return;
  const d=new Date(),h=d.getHours();
  msgs.push({id:nid++,s:cur,x,t:$("tm").value.trim()||(h<12?"오전 ":"오후 ")+((h%12)||12)+":"+String(d.getMinutes()).padStart(2,"0")});
  t.value="";$("tm").value="";render();
  const rs=U[cur].querySelector(".radio"),ro=U[1-cur].querySelector(".radio");
  flash(rs,"tx");flash(ro,"rx");flash(rs.querySelector(".arc"),"go");
}
$("go").onclick=send;
t.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};
$("clr").onclick=()=>{msgs=[];edit=null;render()};
render();
const h2r=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),r2h=a=>"#"+a.map(v=>Math.round(v).toString(16).padStart(2,"0")).join("");
const mix=(a,b,t)=>{const x=h2r(a),y=h2r(b);return r2h(x.map((v,i)=>v+(y[i]-v)*t))};
function setCol(i,v){const u=U[i],h=u.querySelector(".hex");u.querySelector("input[type=color]").value=v;h.value=v;h.style.borderBottomColor="";root.setProperty("--c"+K[i],v)}
function applyBg(v){
  BG=v;THM.basic.bg=v;const[r,g,b]=h2r(v),dark=(0.299*r+0.587*g+0.114*b)<110;
  const Q=dark?{tx:"#e6edf0",ti:mix(v,"#ffffff",.08),tt:"#e6edf0",cb2:mix(v,"#ffffff",.04),line:mix(v,"#ffffff",.25)}:{tx:"#1c2b33",ti:mix(v,"#ffffff",.5),tt:"#1c2b33",cb2:mix(v,"#ffffff",.4),line:mix(v,"#000000",.18)};
  root.setProperty("--pgbg",v);root.setProperty("--onc",v);for(const k in Q)root.setProperty("--"+k,Q[k]);
  root.setProperty("color-scheme",dark?"dark":"light");
  U.forEach(u=>{const rd=u.querySelector(".radio");rd.querySelector("svg").remove();rd.insertAdjacentHTML("afterbegin",radioSVG())});
}
const bgp=$("bgp"),bgh=$("bgh");
bgp.oninput=()=>{bgh.value=bgp.value;bgh.style.borderColor="";applyBg(bgp.value)};
bgh.oninput=()=>{let v=bgh.value.trim();if(v[0]!=="#")v="#"+v;if(/^#[0-9a-f]{3}$/i.test(v))v="#"+[...v.slice(1)].map(x=>x+x).join("");
  if(/^#[0-9a-f]{6}$/i.test(v)){v=v.toLowerCase();bgp.value=v;bgh.style.borderColor="";applyBg(v)}else bgh.style.borderColor="#e5484d"};
[["아이보리","#f4f2ee","#1c2b33","#8c2f39"],["화이트","#ffffff","#1c2b33","#8c2f39"],["연회색","#e3e6e8","#1c2b33","#8c2f39"],["네이비","#0f1c26","#e6edf0","#e59aa3"],["블랙","#0b0b0c","#eeeeee","#ff9a9a"]].forEach(p=>{
  const b=document.createElement("button");b.className="sw";b.style.background=p[1];b.title=p[0];b.setAttribute("aria-label",p[0]);
  b.onclick=()=>{bgp.value=bgh.value=p[1];bgh.style.borderColor="";applyBg(p[1]);setCol(0,p[2]);setCol(1,p[3]);sync();render()};
  $("sws").appendChild(b)});
applyBg("#ffffff");

/* ---------- script import ---------- */
const EX=`<노시훈/04:12>
[서아영 중위. 7구역 초소 진입 확인 보고해라. 안개 농도 기준치 초과했다.]

<서아영/04:13>
[치직... 네, 대위님. 7구역 차폐문 안쪽 진입 완료했습니다. 필터 잔여량 아직 충분해요.]

<노시훈/04:14>
[목소리 갈라지는데. 과호흡 오기 직전이면 숨 고르고 말해. 장비 수치만 믿다 골로 간다.]

<서아영/04:15>
[아닙니다, 멀쩡해요. 방독면 습기 때문에 조금 답답했을 뿐이에요. 걱정 안 하셔도 돼요.]

<노시훈/04:16>
[걱정이 아니라 규정 확인이다. 15분마다 생체 신호 체크해. 이상 생기면 즉시 후퇴해라.]`;
$("prm").value=`OOC: 기존 스토리와 관계 없는 광증 안개 세계관 속 노시훈과 서아영의 무전 로그 5개 출력 대화는 서로 주고 받는다, 로그 하나 당 대사 10개를 넘기지 않는다.

형식:

/* minimal GIF encoder */
function lzw(px){
  const out=[];let bits=0,nb=0,size=9,next=258,dict=new Map();
  const emit=(v,s)=>{bits|=v<<nb;nb+=s;while(nb>=8){out.push(bits&255);bits>>>=8;nb-=8}};
  emit(256,size);let pre=px[0];
  for(let i=1;i<px.length;i++){
    const k=px[i],key=pre*256+k,v=dict.get(key);
    if(v!==undefined){pre=v;continue}
    emit(pre,size);dict.set(key,next++);
    if(next-1===(1<<size)&&size<12)size++;
    if(next>4095){emit(256,size);size=9;next=258;dict.clear()}
    pre=k;
  }
  emit(pre,size);emit(257,size);if(nb>0)out.push(bits&255);
  return out;
}
function gif(fr,w,h,pal){

  "GIF89a".split("").forEach(ch=>p(ch.charCodeAt(0)));

  p(0x21,0xFF,11);"NETSCAPE2.0".split("").forEach(ch=>p(ch.charCodeAt(0)));p(3,1,0,0,0);
  fr.forEach(f=>{const[x,y,fw,fh]=f.bb;
    p(0x21,0xF9,4,4);w16(f.d);p(0,0);
    p(0x2C);w16(x);w16(y);w16(fw);w16(fh);p(0,8);
    const data=lzw(f.idx);
    for(let i=0;i<data.length;i+=255){const ch=data.slice(i,i+255);o.push(ch.length);for(const v of ch)o.push(v)}

  });
  o.push(0x3B);return new Uint8Array(o);
}

function mkPal(ca,cb,bgh){
  const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),bg=hx(bgh),bytes=new Uint8Array(768);

function quant(d,W,bb,PAL){
  const[x0,y0,w,h]=bb,out=new Uint8Array(w*h),{bg,V}=PAL;
  for(let y=0,n=0;y<h;y++)for(let x=0;x<w;x++,n++){

    let best=1e9,bi=0;

      const q=V[m],v=q.v;let t=(r*v[0]+g*v[1]+b*v[2])/q.vv;t=t<0?0:t>1?1:t;
